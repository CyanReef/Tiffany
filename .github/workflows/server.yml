name: Server
on: [push, pull_request, workflow_dispatch, workflow_call]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install build 'setuptools>=77.0.3' wheel
      - run: python -B tools/prepare_distribution.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: dist/release/

  source:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.12'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: ubuntu-latest, python: '3.14'}
          - {os: windows-latest, python: '3.11'}
          - {os: windows-latest, python: '3.14'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build "setuptools>=77.0.3" wheel
      - run: >-
          python -m pip install --require-hashes --only-binary=:all: -r requirements-server.lock
      - run: python -B -m unittest discover -s tests -t . -q
      - run: bash -n start.sh
        if: runner.os == 'Linux'
      - run: python -B tools/build_release.py

  installed:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.12'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: ubuntu-latest, python: '3.14'}
          - {os: windows-latest, python: '3.11'}
          - {os: windows-latest, python: '3.14'}
    runs-on: ${{ matrix.os }}
    steps:
      # No checkout: the wheel must supply every runtime module.
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: candidate
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify artifact checksums
        run: python -c "from pathlib import Path; import hashlib; root=Path('candidate'); records=[line.split('  ',1) for line in (root/'SHA256SUMS').read_text().splitlines()]; assert all(hashlib.sha256((root/name).read_bytes()).hexdigest()==checksum for checksum,name in records)"
      - name: Extract the packaged dependency lock
        run: python -c "from pathlib import Path; import zipfile; wheel=next(Path('candidate').glob('*.whl')); Path('server.lock').write_bytes(zipfile.ZipFile(wheel).read('shared/_resources/requirements-server.lock'))"
      - run: >-
          python -m pip download --require-hashes --only-binary=:all: -r server.lock --dest wheelhouse
      - run: python -m pip install uv
      - name: Install and exercise the artifact offline
        run: python -c "from pathlib import Path; import subprocess,sys; subprocess.run([sys.executable,'candidate/installed_acceptance.py','--wheel',str(next(Path('candidate').glob('*.whl'))),'--wheelhouse','wheelhouse','--uv'],check=True)"
