[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiffany-hook-runtime"
version = "0.1.0"
description = "A raw-first, synchronous-lazy hook runtime"
requires-python = ">=3.11"
dependencies = [
    "websockets>=16,<17",
]

[project.optional-dependencies]
openmetrics = [
    "aiohttp>=3.11,<4",
    "prometheus-client>=0.22,<1",
]

[tool.setuptools]
packages = ["adapters", "clients", "core", "hooks"]
py-modules = ["application", "fields", "main", "settings"]
