[bot]
name = "Tiffany"

[adapter]
type = "onebot_websocket"
platform = "napcat"

[adapter.websocket]
host = "127.0.0.1"
port = 6199
workers = 4
queue_size = 256
call_timeout = 30.0
pending_limit = 256
# Environment variable takes priority over data/secrets/credentials.json.
token_env = "TIFFANY_ONEBOT_TOKEN"

[logging]
level = "INFO"
max_bytes = 10485760
backups = 10

[monitoring]
enabled = true
host = "127.0.0.1"
port = 9464
allow_remote = false

[restart]
enabled = true
window = 600.0
max_restarts = 5
delays = [2, 5, 15, 30, 60]
stop_timeout = 45.0
