[bot]
name = "tiffany"

[adapter]
type = "onebot_websocket"
platform = "napcat"

[adapter.websocket]
host = "127.0.0.1"
port = 6199
# Optional workers = 1 limits event concurrency; ordering is per session.
call_timeout = 30.0
pending_limit = 256

[scheduler]
max_events = 8192
buffer_budget_bytes = 67108864
max_concurrency = 64
